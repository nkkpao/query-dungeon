services:
  postgres:
    image: postgres:16
    container_name: postgres-query-dungeon
    environment:
      POSTGRES_USER: dungeon
      POSTGRES_PASSWORD: dungeon
      POSTGRES_DB: dungeon
    ports:
      - "54329:5432"
    volumes:
      - postgres-query-dungeon-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dungeon -d dungeon"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-query-dungeon-data:
